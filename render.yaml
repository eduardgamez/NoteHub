services:
  - type: web
    name: notehub-ai
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NOTEHUB_REQUIRE_AUTH
        value: "true"
      - key: NOTEHUB_WEB_ORIGIN
        value: https://eduardgamez.github.io,capacitor://localhost
      - key: SUPABASE_URL
        value: https://iqnpmbnckuqbqvxkkqcu.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
