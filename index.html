<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f5" />
    <meta name="description" content="NoteHub — your notes, code, ink, and plans in one calm workspace." />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('notehub-theme');
          const theme = saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themePreference = saved || 'system';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#191a1a' : '#f7f7f5');
        } catch (_) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/notehub-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/notehub-192.png" />
    <title>NoteHub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
